name: argent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: argent
      POSTGRES_PASSWORD: argent
      POSTGRES_DB: argent
    ports:
      # 5434 avoids clashing with other local PostgreSQL containers; override with ARGENT_POSTGRES_PORT.
      - '${ARGENT_POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U argent -d argent']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '${ARGENT_MAILPIT_SMTP_PORT:-1025}:1025'
      - '${ARGENT_MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
